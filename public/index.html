<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <meta name="description" content="Ikat by Malika Shakirova — qo'lda to'qilgan ikat kiyimlar do'koni">
  <title>Ikat by Malika Shakirova</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050807'/%3E%3Cpath d='M32 5l20 27-20 27-20-27z' fill='%230d7052' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M32 20l9 12-9 12-9-12z' fill='%23050807' stroke='%23f0d990' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Telegram kutubxonasi faqat Telegram ichida yuklanadi (oddiy brauzerda sayt uni kutib turmaydi)
    (function () {
      var inTg = /tgWebApp/.test(location.hash) || window.TelegramWebviewProxy;
      try { inTg = inTg || sessionStorage.getItem('__telegram__initParams'); } catch (e) { /* */ }
      if (inTg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f8e7ae"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#94701a"/>
      </linearGradient>
      <linearGradient id="emer" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1c9b73"/><stop offset="1" stop-color="#07382a"/>
      </linearGradient>
      <!-- Belgi: ikat rombi, chetlari ipdek tishli -->
      <symbol id="logo" viewBox="0 0 100 130">
        <path d="M50 3l7 13 7 3 4 14 8 4 4 14 9 5 4 9-4 9-9 5-4 14-8 4-4 14-7 3-7 13-7-13-7-3-4-14-8-4-4-14-9-5-4-9 4-9 9-5 4-14 8-4 4-14 7-3z" fill="url(#emer)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M50 31l6 12 5 3 4 10 7 4 3 5-3 5-7 4-4 10-5 3-6 12-6-12-5-3-4-10-7-4-3-5 3-5 7-4 4-10 5-3z" fill="#050807" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M50 51l8 14-8 14-8-14z" fill="url(#gold)"/>
      </symbol>
    </defs>
  </svg>

  <div id="splash" aria-live="polite">
    <canvas id="sp-cloth"></canvas>
    <div class="sp-plate">
      <svg viewBox="0 0 100 130"><use href="#logo"/></svg>
      <div class="sp-brand">IKAT</div>
      <div class="sp-sub">by Malika Shakirova</div>
    </div>
  </div>

  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="/js/ikat.js"></script>
  <script>Ikat.initVars(); Ikat.paint(document.getElementById('sp-cloth'), { weave: true, cell: 170 });</script>
  <script src="/js/icons.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/shop.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
