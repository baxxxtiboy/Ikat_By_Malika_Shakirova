<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <meta name="description" content="Ikat by Malika Shakirova. Ikat ko‘ylaklar katalogi.">
  <title>Ikat by Malika Shakirova</title>
  <link rel="icon" href="rasmlar/favicon.png">
  <link rel="stylesheet" href="css/1-asosiy.css">
  <link rel="stylesheet" href="css/2-oyna.css">
  <link rel="stylesheet" href="css/3-sehr.css" id="css-kuchli">
  <link rel="stylesheet" href="css/4-sodda.css" id="css-sodda">

  <!-- Tillar va mahsulotlar birinchi yuklanadi -->
  <script src="js/0-tillar.js"></script>
  <script src="js/1-mahsulotlar.js"></script>
  <script>
    // Sodda yoki kuchli: keraksiz uslub fayli olib tashlanadi
    document.getElementById(DOKON.animatsiya === "kuchli" ? "css-sodda" : "css-kuchli").remove();
  </script>
</head>
<body>

  <!-- ============ KIRISHDAGI OLTIN ESHIK (6-kirish.js) ============ -->
  <div id="kirish" aria-hidden="true" hidden>
    <div class="tavaqa"></div>
    <div class="tavaqa ong"></div>
    <div class="muhr"><img src="rasmlar/belgi.webp" alt=""></div>
  </div>
  <canvas id="sahifa-zarra" aria-hidden="true"></canvas>

  <!-- ============ TEPA QISM ============ -->
  <div class="bosh">
    <div class="tillar" data-tillar role="group" data-til-aria="tilniTanlash"></div>
    <header class="bosh-matn">
      <img class="belgi" src="rasmlar/belgi.webp" alt="" width="360" height="360">
      <h1><span>Ikat by</span> Malika Shakirova</h1>
      <p data-til="boshMatn">Rangni tanlang va ko‘ylakni yaqindan ko‘ring.</p>
      <div class="bosh-tanlov">
        <div id="bosh-ranglar" class="ranglar" role="group" data-til-aria="koylakRangi"></div>
        <span id="bosh-nomi"></span>
      </div>
      <a class="tugma" href="#katalog"><span data-til="katalogniKorish">Katalogni ko‘rish</span></a>
    </header>

    <button id="bosh-rasm" class="zumrad" type="button" aria-label="Ko‘ylakni ochish">
      <img src="rasmlar/naqsh.jpg" alt="">
      <canvas></canvas>
    </button>
  </div>

  <!-- ============ KATALOG (4-katalog.js to‘ldiradi) ============ -->
  <main id="katalog"></main>

  <!-- ============ PASTKI QISM ============ -->
  <footer class="past">
    <div class="past-quti">
      <img class="belgi" src="rasmlar/belgi.webp" alt="" width="360" height="360" loading="lazy">
      <p data-til="buyurtmaUchun">Buyurtma va narxlar uchun</p>
      <a class="past-tel" data-telefon href="#"></a>
      <a data-instagram="nom" href="#" target="_blank" rel="noopener"></a>
    </div>
  </footer>

  <!-- ============ OCHILGAN MAHSULOT OYNASI (5-oyna.js boshqaradi) ============ -->
  <dialog id="oyna" aria-labelledby="o-nomi">
    <div class="oyna-fon"></div>
    <canvas id="oyna-zarra"></canvas>
    <div class="chaqnoq"></div>

    <div class="oyna-tepa">
      <span id="o-hisob"></span>
      <div class="tillar" data-tillar role="group" data-til-aria="tilniTanlash"></div>
      <div class="oyna-boshqaruv">
        <button type="button" id="o-oldingi" data-til-aria="oldingi"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
        <button type="button" id="o-keyingi" data-til-aria="keyingi"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
        <button type="button" id="o-yop" data-til-aria="yopish"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
    </div>

    <div class="oyna-ichi">
      <div class="sahna-joy">
        <div class="nur"></div>
        <div id="sahna" class="zumrad">
          <div class="rasm-joy"><img id="sahna-rasm" alt="" hidden></div>
          <canvas id="sahna-canvas" hidden></canvas>
        </div>
      </div>

      <div class="oyna-matn">
        <p id="o-toplam" class="kel" style="--k:0"></p>
        <h2 id="o-nomi"></h2>
        <p id="o-tavsif" class="kel" style="--k:1"></p>

        <div class="kel guruh" style="--k:2">
          <span class="yorliq"><span data-til="rang">Rang</span>: <b id="o-rang-nomi"></b></span>
          <div id="o-ranglar" class="ranglar" role="group" data-til-aria="rang"></div>
        </div>

        <div class="kel guruh" style="--k:3">
          <span class="yorliq" data-til="yaqindan">Yaqindan ko‘rish</span>
          <div id="o-detallar" class="detallar" role="group" data-til-aria="yaqindan"></div>
        </div>

        <div id="o-olchamlar" class="kel guruh" style="--k:4" hidden>
          <span class="yorliq" data-til="olchamlar">O‘lchamlar</span>
          <div class="detallar"></div>
        </div>

        <div class="kel buyurtma" style="--k:5">
          <strong id="o-narx"></strong>
          <a class="tugma" data-instagram="tugma" href="#" target="_blank" rel="noopener"><span data-til="instagramda">Instagramda yozish</span></a>
          <a class="telefon" data-telefon href="#"></a>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Tartibi muhim: raqami bo‘yicha -->
  <script src="js/2-animatsiyalar.js"></script>
  <script src="js/3-zarralar.js"></script>
  <script src="js/4-katalog.js"></script>
  <script src="js/5-oyna.js"></script>
  <script src="js/6-kirish.js"></script>
</body>
</html>
